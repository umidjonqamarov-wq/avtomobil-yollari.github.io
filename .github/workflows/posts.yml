name: Kanal postlarini yangilash
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: posts
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/scrape.py
      - name: Saqlash
        run: |
          git config user.name "yol-muhandis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet && exit 0
          git commit -m "Kanal postlari yangilandi"
          git push
